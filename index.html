<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>Band Sight Reading</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div><p class="eyebrow">BEGINNING BAND · B♭ MAJOR · 4/4</p><h1>Band Sight Reading</h1></div><button id="theme" class="icon" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode">☾ Dark mode</button></header><section class="toolbar" aria-label="Exercise settings"><label>View<select id="mode"><option value="class">Class mode</option><option value="single">Instrument mode</option></select></label><label id="instrument-wrap" hidden>Part<select id="instrument"><option value="concert">Concert / flute</option><option value="clarinet">B♭ / clarinet</option><option value="trumpet">B♭ / trumpet</option><option value="alto">E♭ / alto saxophone</option><option value="bass">Bass clef / low brass</option><option value="mallets">Mallets</option></select></label><label>Level<select id="level"><option value="1">1 · Three notes</option><option value="2">2 · Three notes + eighths</option><option value="3">3 · Three notes + rests</option><option value="4">4 · Five notes</option><option value="5">5 · Five notes + eighths</option><option value="6">6 · Five notes + rests</option><option value="7">7 · Eight notes</option><option value="8">8 · Expression</option></select></label><label>Length<select id="measures"><option value="4">4 measures</option><option value="8">8 measures</option></select></label><label id="tempo-wrap" hidden>Tempo<input id="tempo-slider" type="range" min="48" max="172" value="68"><output id="tempo-value" for="tempo-slider">68 BPM</output></label></section><section id="score-area" class="score-area"><div class="score-head"><div><span id="exercise-number">EXERCISE 1</span><h2 id="score-title">Level 1 · 4 measures</h2></div><span id="status" role="status" aria-live="polite">Ready to read</span></div><div id="scores"></div></section><footer><div class="actions"><button id="proceed" class="primary">Hear this exercise</button><button id="replay" hidden>Hear again</button><button id="new-exercise">New exercise · skip audio</button><button id="copy-link" hidden>Copy student link</button><button id="play-along" hidden aria-pressed="false">Play along</button><button id="tracker" hidden aria-pressed="true">Tracker: on</button><button id="metro" aria-pressed="false">Metronome: off</button></div><p class="hint">Proceed plays the current line, then keeps it on screen. Double-click to skip ahead.</p></footer></main><script type="module" src="app.js"></script></body></html>
