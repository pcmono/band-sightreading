<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band Sight Reading · Checks</title><link rel="stylesheet" href="style.css"><style>.check-panel{max-width:760px;margin:5vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}.check-panel li{padding:10px 0;border-top:1px solid var(--line)}.pass{color:#08734b}.fail{color:#bd3838}body.dark .pass{color:#8ae1b5}body.dark .fail{color:#ffa4a4}iframe{position:absolute;width:1px;height:1px;left:-9999px;border:0}</style></head><body><main class="check-panel"><p class="eyebrow">VERIFICATION</p><h1>Band Sight Reading checks</h1><p>Run these checks after changing the music rules or interface. No student information is used or stored.</p><button id="run" class="primary">Run checks</button><p id="result" role="status" aria-live="polite"></p><ul id="details"></ul><p><a href="./">Back to the app</a></p></main><iframe id="app-frame" title="App check"></iframe><script type="module">
import{runChecks}from'./checks.mjs';
const results=document.getElementById('details'),status=document.getElementById('result'),frame=document.getElementById('app-frame');
function display(checks){status.textContent=`${checks.filter(c=>c.passed).length} of ${checks.length} checks passed`;results.replaceChildren(...checks.map(c=>{const li=document.createElement('li');li.className=c.passed?'pass':'fail';li.textContent=`${c.passed?'PASS':'FAIL'} — ${c.name}${c.detail?': '+c.detail:''}`;return li}))}
function inspect(name,fn){try{if(!fn())throw new Error('Unexpected display or control state');return{name,passed:true}}catch(error){return{name,passed:false,detail:error.message}}}
function run(){const checks=runChecks();status.textContent='Checking app view…';frame.onload=()=>{const doc=frame.contentDocument,by=id=>doc.getElementById(id);checks.push(inspect('Student link opens one selected part',()=>by('mode').value==='single'&&by('instrument').value==='alto'&&by('scores').querySelectorAll('.part').length===1));by('mode').value='class';by('mode').dispatchEvent(new Event('change',{bubbles:true}));checks.push(inspect('Class view fits six eight-measure parts',()=>by('scores').querySelectorAll('.part').length===6&&by('scores').querySelectorAll('svg[viewBox="0 0 2300 170"]').length===6&&by('tempo-wrap').hidden));const before=by('exercise-number').textContent;by('new-exercise').click();checks.push(inspect('New exercise skips audio',()=>before!==by('exercise-number').textContent&&by('proceed').textContent==='Hear this exercise'));by('level').value='8';by('level').dispatchEvent(new Event('change',{bubbles:true}));checks.push(inspect('Level 8 removes courtesy accidentals',()=>by('scores').querySelectorAll('[data-accidental]').length===0));display(checks)};frame.src=`./?view=single&instrument=alto&level=7&measures=8&check=${Date.now()}`}
document.getElementById('run').onclick=run;run();
</script></body></html>
